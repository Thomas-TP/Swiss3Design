# Mises à jour de dépendances automatisées.
# Chaque PR Dependabot génère un build de preview Cloudflare Workers Builds.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Regroupe les MAJ mineures et correctives en une seule PR.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Les MAJ MAJEURES, hors groupe, arrivent chacune dans sa propre PR :
    # Next.js, React et OpenNext sont sensibles (cf. AGENTS.md), elles demandent
    # une revue manuelle + la preview. (Elles étaient toutes ignorées jusqu'en
    # septembre 2026, contrairement à ce que disait ce commentaire.)
    ignore:
      # TypeScript 7.0 casse `next build` (plus d'API JS, cf. AGENTS.md) :
      # attendre la 7.1, qui sera proposée normalement.
      - dependency-name: "typescript"
        versions: ["7.0.x"]

  # Actions GitHub de la CI (quality.yml) : sans cette entrée, actions/checkout
  # était resté en v4, trois versions majeures en retard.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
