name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Même version majeure que la base Neon de production (18).
        image: postgres:18
        env:
          POSTGRES_DB: swiss3design_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swiss3design_ci
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun scripts/ci-migrate.ts
      - run: bun run test
      # Deux avis ignorés (24.10.2026), outils de build seulement, jamais dans le
      # Worker : GHSA-5j98-mcp5-4vw2 vise la CLI de glob (-c/--cmd), que
      # @node-minify/core (via @opennextjs/aws) n'appelle pas ; GHSA-xjj6-f33q-929c
      # vise undici 7.29, épinglé par miniflare (wrangler dev en local). À retirer
      # dès qu'OpenNext et wrangler publient des versions qui les remontent.
      - run: bun audit --audit-level=high --ignore=GHSA-5j98-mcp5-4vw2 --ignore=GHSA-xjj6-f33q-929c
