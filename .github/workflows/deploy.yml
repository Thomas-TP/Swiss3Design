# CI : build de validation à chaque push sur main et à chaque pull request.
#
# Le DÉPLOIEMENT (build + migrations D1 + deploy) est désormais géré par
# Cloudflare Workers Builds via la connexion Git native — voir
# docs/deploiement-cloudflare.md. Plus aucun secret CLOUDFLARE_API_TOKEN ici :
# ce workflow ne fait que valider que le projet compile avant que Cloudflare ne
# déploie. Aucun risque de double déploiement.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Valide les types TypeScript + le bundle OpenNext. Pas d'authentification
      # Cloudflare requise : c'est une simple validation locale au runner.
      - run: npx opennextjs-cloudflare build
