# CI/CD : build de validation à chaque push, migrations D1 + déploiement Cloudflare
# si le token existe.
#
# Pour activer le déploiement automatique :
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token
#      Modèle « Edit Cloudflare Workers » + permission Account → D1 → Edit
#      (requise pour appliquer les migrations de base de données)
#   2. GitHub → repo Swiss3Design → Settings → Secrets and variables → Actions
#      → New repository secret : CLOUDFLARE_API_TOKEN
# Sans le secret, le build tourne quand même (validation) et le déploiement est sauté.
name: CI & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build OpenNext (webpack — voir open-next.config.ts) : valide le code à chaque push
      - run: npx opennextjs-cloudflare build
      # Applique les migrations D1 manquantes (idempotent) AVANT le nouveau code,
      # pour que le worker déployé ne tourne jamais sur un schéma en retard.
      - name: Apply D1 migrations
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler d1 migrations apply swiss3design-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Déploiement sauté (pas de CLOUDFLARE_API_TOKEN)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "Build OK. Ajoutez le secret CLOUDFLARE_API_TOKEN pour activer le déploiement automatique."
